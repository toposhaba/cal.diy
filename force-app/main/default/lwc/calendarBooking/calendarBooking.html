<template>
    <lightning-card title="Book a Meeting" icon-name="standard:event">
        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>{error}</h2>
                </div>
            </div>
        </template>

        <!-- Step 1: Event Type Selection -->
        <template lwc:if={isEventTypeStep}>
            <div class="slds-p-around_medium">
                <h2 class="slds-text-heading_small slds-m-bottom_medium">Select a Meeting Type</h2>
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <template for:each={eventTypes} for:item="eventType">
                        <div key={eventType.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                            <div class="slds-box slds-box_link" data-id={eventType.Id} onclick={handleEventTypeSelect}>
                                <h3 class="slds-text-heading_small">{eventType.Name}</h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    {eventType.Duration_Minutes__c} minutes
                                </p>
                                <template lwc:if={eventType.Description__c}>
                                    <p class="slds-m-top_x-small slds-text-body_small">{eventType.Description__c}</p>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Step 2: Date & Time Selection -->
        <template lwc:if={isDateSelectStep}>
            <div class="slds-p-around_medium">
                <div class="slds-m-bottom_medium">
                    <lightning-button label="Back" variant="neutral" onclick={handleBack}></lightning-button>
                </div>
                <h2 class="slds-text-heading_small slds-m-bottom_small">
                    {selectedEventType.Name} - {selectedEventType.Duration_Minutes__c} min
                </h2>
                <lightning-input
                    type="date"
                    label="Select Date"
                    value={selectedDate}
                    min={minDate}
                    max={maxDate}
                    onchange={handleDateChange}>
                </lightning-input>

                <template lwc:if={hasSlots}>
                    <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Available Times</h3>
                    <div class="slds-grid slds-wrap slds-gutters_xx-small">
                        <template for:each={formattedSlots} for:item="slot">
                            <div key={slot.index} class="slds-col slds-size_1-of-3 slds-m-bottom_xx-small">
                                <lightning-button
                                    label={slot.slotLabel}
                                    data-index={slot.index}
                                    onclick={handleSlotSelect}
                                    variant="neutral"
                                    class="slds-button_stretch">
                                </lightning-button>
                            </div>
                        </template>
                    </div>
                </template>

                <template lwc:if={noSlots}>
                    <template lwc:if={notLoading}>
                        <p class="slds-m-top_medium slds-text-color_weak">No available times for this date.</p>
                    </template>
                </template>
            </div>
        </template>

        <!-- Step 3: Booking Form -->
        <template lwc:if={isBookingFormStep}>
            <div class="slds-p-around_medium">
                <div class="slds-m-bottom_medium">
                    <lightning-button label="Back" variant="neutral" onclick={handleBack}></lightning-button>
                </div>
                <h2 class="slds-text-heading_small slds-m-bottom_small">{selectedEventType.Name}</h2>
                <p class="slds-m-bottom_medium slds-text-color_weak">{selectedSlotFormatted}</p>

                <template lwc:if={hasFieldSet}>
                    <template for:each={renderableFields} for:item="field">
                        <div key={field.apiName} class="slds-m-bottom_small">
                            <template lwc:if={field.isContactLookup}>
                                <lightning-record-picker
                                    label={field.label}
                                    placeholder="Search contacts..."
                                    object-api-name="Contact"
                                    data-field={field.apiName}
                                    onchange={handleContactSelect}
                                ></lightning-record-picker>
                            </template>
                            <template lwc:elseif={field.isEmail}>
                                <lightning-input
                                    type="email"
                                    label={field.label}
                                    value={field.value}
                                    data-field={field.apiName}
                                    onchange={handleFieldChange}
                                    required={field.isRequired}
                                ></lightning-input>
                            </template>
                            <template lwc:elseif={field.isPhone}>
                                <lightning-input
                                    type="tel"
                                    label={field.label}
                                    value={field.value}
                                    data-field={field.apiName}
                                    onchange={handleFieldChange}
                                    required={field.isRequired}
                                ></lightning-input>
                            </template>
                            <template lwc:elseif={field.isTextArea}>
                                <lightning-textarea
                                    label={field.label}
                                    value={field.value}
                                    data-field={field.apiName}
                                    onchange={handleFieldChange}
                                    required={field.isRequired}
                                ></lightning-textarea>
                            </template>
                            <template lwc:elseif={field.isCheckbox}>
                                <lightning-input
                                    type="checkbox"
                                    label={field.label}
                                    data-field={field.apiName}
                                    onchange={handleFieldChange}
                                ></lightning-input>
                            </template>
                            <template lwc:else>
                                <lightning-input
                                    type="text"
                                    label={field.label}
                                    value={field.value}
                                    data-field={field.apiName}
                                    onchange={handleFieldChange}
                                    required={field.isRequired}
                                ></lightning-input>
                            </template>
                        </div>
                    </template>
                </template>

                <template lwc:if={hasFieldSet}>
                </template>
                <template lwc:else>
                    <lightning-input
                        type="text"
                        label="Your Name"
                        value={bookerName}
                        onchange={handleNameChange}
                        required>
                    </lightning-input>
                    <lightning-input
                        type="email"
                        label="Your Email"
                        value={bookerEmail}
                        onchange={handleEmailChange}
                        required
                        class="slds-m-top_small">
                    </lightning-input>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-input type="checkbox" label="Book as recurring series" checked={isRecurring} onchange={handleRecurringChange}></lightning-input>
                </div>
                <template lwc:if={isRecurring}>
                    <lightning-combobox
                        label="Frequency"
                        value={recurringFrequency}
                        options={frequencyOptions}
                        onchange={handleFrequencyChange}
                        class="slds-m-top_small">
                    </lightning-combobox>
                    <lightning-input
                        type="number"
                        label="Number of occurrences"
                        value={recurringOccurrences}
                        min="2"
                        max="52"
                        onchange={handleOccurrencesChange}
                        class="slds-m-top_small">
                    </lightning-input>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Confirm Booking"
                        variant="brand"
                        onclick={handleBookingSubmit}>
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- Step 4: Confirmation -->
        <template lwc:if={isConfirmationStep}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <div class="slds-text-align_center">
                    <lightning-icon icon-name={confirmationIcon} size="large" class="slds-m-bottom_medium"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">{confirmationHeading}</h2>
                    <p class="slds-text-body_regular">{selectedEventType.Name}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{selectedSlotFormatted}</p>
                    <template lwc:if={confirmedBooking}>
                        <p class="slds-m-top_small slds-text-body_small">
                            Reference: {confirmedBooking.UID__c}
                        </p>
                    </template>
                    <div class="slds-m-top_large">
                        <lightning-button label="Book Another" variant="neutral" onclick={handleStartOver}></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
