<template>
    <lightning-card title="My Bookings" icon-name="standard:today">
        <div slot="actions">
            <lightning-button-icon icon-name="utility:refresh" onclick={loadBookings} alternative-text="Refresh"></lightning-button-icon>
        </div>

        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="date" label="From" value={startDate} onchange={handleStartDateChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="date" label="To" value={endDate} onchange={handleEndDateChange}></lightning-input>
                </div>
            </div>
            <div class="slds-m-bottom_medium">
                <lightning-input
                    type="search"
                    label="Search"
                    placeholder="Search by title, booker name, or email"
                    value={searchTerm}
                    onchange={handleSearchChange}>
                </lightning-input>
            </div>

            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <h2>{error}</h2>
                </div>
            </template>

            <template lwc:if={hasBookings}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Title</div></th>
                            <th scope="col"><div class="slds-truncate">When</div></th>
                            <th scope="col"><div class="slds-truncate">Booker</div></th>
                            <th scope="col"><div class="slds-truncate">Status</div></th>
                            <th scope="col"><div class="slds-truncate">Actions</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={formattedBookings} for:item="booking">
                            <tr key={booking.Id}>
                                <td><div class="slds-truncate">{booking.Title__c}</div></td>
                                <td><div class="slds-truncate">{booking.formattedStart} - {booking.formattedEnd}</div></td>
                                <td><div class="slds-truncate">{booking.Booker_Name__c} ({booking.Booker_Email__c})</div></td>
                                <td><span class={booking.statusClass}>{booking.Status__c}</span></td>
                                <td>
                                    <template lwc:if={booking.isActive}>
                                        <template lwc:if={booking.isPending}>
                                            <lightning-button label="Confirm" variant="success" size="small" data-id={booking.Id} onclick={handleConfirm}></lightning-button>
                                        </template>
                                        <template lwc:if={booking.canReschedule}>
                                            <lightning-button label="Reschedule" variant="neutral" size="small" data-id={booking.Id} onclick={handleRescheduleClick} class="slds-m-left_xx-small"></lightning-button>
                                        </template>
                                        <template lwc:if={booking.canCancel}>
                                            <lightning-button label="Cancel" variant="destructive" size="small" data-id={booking.Id} onclick={handleCancelClick} class="slds-m-left_xx-small"></lightning-button>
                                        </template>
                                        <template lwc:if={booking.hasSeries}>
                                            <lightning-button label="Cancel Series" variant="destructive-text" size="small" data-pattern={booking.Recurring_Pattern__c} onclick={handleSeriesCancelClick} class="slds-m-left_xx-small"></lightning-button>
                                        </template>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template lwc:if={noBookings}>
                <template lwc:if={notLoading}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <p class="slds-text-color_weak">{emptyMessage}</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={showCancelModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={handleCancelModalClose} alternative-text="Close" class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Cancel Booking</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea label="Cancellation Reason" value={cancelReason} onchange={handleCancelReasonChange}></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Go Back" onclick={handleCancelModalClose}></lightning-button>
                    <lightning-button label="Cancel Booking" variant="destructive" onclick={handleCancelConfirm}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={showRescheduleModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={handleRescheduleModalClose} alternative-text="Close" class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Reschedule Booking</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input type="date" label="New Date" value={rescheduleDate} onchange={handleRescheduleDateChange}></lightning-input>
                    <template lwc:if={formattedRescheduleSlots.length}>
                        <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Available Times</h3>
                        <div class="slds-grid slds-wrap slds-gutters_xx-small">
                            <template for:each={formattedRescheduleSlots} for:item="slot">
                                <div key={slot.index} class="slds-col slds-size_1-of-3 slds-m-bottom_xx-small">
                                    <lightning-button label={slot.formattedTime} data-index={slot.index} onclick={handleRescheduleSlotSelect} variant={slot.buttonVariant}></lightning-button>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Go Back" onclick={handleRescheduleModalClose}></lightning-button>
                    <lightning-button label="Reschedule" variant="brand" onclick={handleRescheduleConfirm}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={showSeriesCancelModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={handleSeriesCancelModalClose} alternative-text="Close" class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">Cancel Recurring Series</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-m-bottom_small">This cancels all future bookings in the series.</p>
                    <lightning-textarea label="Cancellation Reason" value={seriesCancelReason} onchange={handleSeriesCancelReasonChange}></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Go Back" onclick={handleSeriesCancelModalClose}></lightning-button>
                    <lightning-button label="Cancel Series" variant="destructive" onclick={handleSeriesCancelConfirm}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
