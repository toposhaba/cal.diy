<template>
    <template lwc:if={isLoading}>
        <div class="slds-align_absolute-center slds-p-around_xx-large">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template lwc:if={error}>
        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
            <span class="slds-assistive-text">error</span>
            <h2>{error}</h2>
        </div>
    </template>

    <template lwc:if={isWizard}>
        <div class="wizard-container slds-card slds-p-around_large">
            <div class="slds-m-bottom_large">
                <h1 class="slds-text-heading_large slds-m-bottom_x-small">Welcome to Cal.DIY</h1>
                <p class="slds-text-body_regular slds-text-color_weak">Let's get your scheduling set up in a few quick steps.</p>
            </div>

            <lightning-progress-indicator current-step={currentStep} type="path" class="slds-m-bottom_large">
                <template for:each={steps} for:item="step">
                    <lightning-progress-step key={step.value} label={step.label} value={step.value}></lightning-progress-step>
                </template>
            </lightning-progress-indicator>

            <template lwc:if={isTimezoneStep}>
                <div class="step-content">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Confirm Your Timezone</h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        This determines when your availability windows are displayed to people booking with you.
                    </p>
                    <lightning-combobox
                        label="Timezone"
                        value={selectedTimeZone}
                        options={timezoneOptions}
                        onchange={handleTimezoneChange}
                        class="slds-m-bottom_medium"
                    ></lightning-combobox>
                    <div class="slds-m-top_large">
                        <lightning-button label="Next" variant="brand" onclick={handleNextFromTimezone}></lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:if={isCalendarStep}>
                <div class="step-content">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Connect a Calendar</h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        Connect your calendar to check for conflicts and push bookings. Google and Microsoft are authenticated once at the org level by your admin.
                    </p>

                    <template lwc:if={showOrgAuthNotice}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Admin setup required</h3>
                            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                                <p class="slds-text-body_regular">{orgAuthMessage}</p>
                            </div>
                            <lightning-button label="Open Integrations" variant="brand" onclick={handleOpenIntegrations} icon-name="utility:settings" class="slds-m-right_small"></lightning-button>
                            <lightning-button label="Skip for now" variant="neutral" onclick={handleSkipOrgAuth}></lightning-button>
                        </div>
                    </template>

                    <template lwc:if={showingAdminOAuthFlow}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">{authenticateCalendarHeading}</h3>
                            <template lwc:if={oauthNotConfigured}>
                                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                                    <p class="slds-text-body_regular">{oauthSetupMessage}</p>
                                </div>
                                <lightning-button label="Open Auth Provider Setup" variant="brand" onclick={handleOpenOAuthSetup} icon-name="utility:settings" class="slds-m-right_small"></lightning-button>
                            </template>
                            <template lwc:if={notShowingOrgAuthNotice}>
                                <p class="slds-text-body_regular slds-m-bottom_medium">
                                    Authenticate the org-level Named Principal, then verify the connection.
                                </p>
                                <lightning-button label="Authenticate" variant="brand" onclick={handleAuthorizeOAuth} icon-name="utility:new_window" class="slds-m-right_x-small"></lightning-button>
                                <lightning-button label="Verify Connection" variant="success" onclick={handleVerifyOAuth} icon-name="utility:check" class="slds-m-right_x-small"></lightning-button>
                                <lightning-button label="Cancel" variant="neutral" onclick={handleCancelAdminAuth}></lightning-button>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={notShowingOrgAuthNotice}>
                        <template lwc:if={notShowingAdminOAuthFlow}>
                            <lightning-combobox
                                label="Calendar Provider"
                                value={calendarProvider}
                                options={providerOptions}
                                onchange={handleProviderChange}
                                placeholder="Select a provider..."
                                class="slds-m-bottom_small"
                            ></lightning-combobox>
                            <lightning-input
                                type="text"
                                label="Calendar ID (optional)"
                                value={calendarId}
                                onchange={handleCalendarIdChange}
                                placeholder="Leave blank for primary calendar"
                                class="slds-m-bottom_small"
                            ></lightning-input>
                            <lightning-input
                                type="checkbox"
                                label="Check for scheduling conflicts"
                                checked={calendarCheckConflicts}
                                onchange={handleCheckConflictsChange}
                                class="slds-m-bottom_small"
                            ></lightning-input>
                            <lightning-input
                                type="checkbox"
                                label="Push new bookings to this calendar"
                                checked={calendarPushEvents}
                                onchange={handlePushEventsChange}
                                class="slds-m-bottom_small"
                            ></lightning-input>
                            <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                                <lightning-button label="Back" onclick={handleBackToTimezone}></lightning-button>
                                <div>
                                    <lightning-button label="Skip" onclick={handleSkipCalendar} class="slds-m-right_small"></lightning-button>
                                    <lightning-button label="Connect & Continue" variant="brand" onclick={handleConnectCalendar}></lightning-button>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <template lwc:if={isAvailabilityStep}>
                <div class="step-content">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Set Your Availability</h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        Define your working hours so people know when you're available for meetings.
                    </p>
                    <lightning-input
                        type="text"
                        label="Schedule Name"
                        value={scheduleName}
                        onchange={handleScheduleNameChange}
                        required
                        class="slds-m-bottom_small"
                    ></lightning-input>
                    <lightning-dual-listbox
                        label="Available Days"
                        source-label="Available"
                        selected-label="Selected"
                        options={dayOptions}
                        value={selectedDaysArray}
                        onchange={handleDaysChange}
                        required
                        class="slds-m-bottom_small"
                    ></lightning-dual-listbox>
                    <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                        <div class="slds-col">
                            <lightning-input
                                type="time"
                                label="Start Time"
                                value={availabilityStartTime}
                                onchange={handleStartTimeChange}
                                required
                            ></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-input
                                type="time"
                                label="End Time"
                                value={availabilityEndTime}
                                onchange={handleEndTimeChange}
                                required
                            ></lightning-input>
                        </div>
                    </div>
                    <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                        <lightning-button label="Back" onclick={handleBackToCalendar}></lightning-button>
                        <lightning-button label="Create Schedule" variant="brand" onclick={handleCreateSchedule}></lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:if={isEventTypeStep}>
                <div class="step-content">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Create Your First Event Type</h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        An event type is the kind of meeting people can book with you (e.g. "30 Minute Call", "1 Hour Consultation").
                    </p>
                    <lightning-input
                        type="text"
                        label="Event Type Name"
                        value={eventTypeName}
                        onchange={handleEventTypeNameChange}
                        required
                        class="slds-m-bottom_small"
                    ></lightning-input>
                    <lightning-input
                        type="number"
                        label="Duration (minutes)"
                        value={eventTypeDuration}
                        onchange={handleEventTypeDurationChange}
                        min="5"
                        max="480"
                        required
                        class="slds-m-bottom_small"
                    ></lightning-input>
                    <lightning-textarea
                        label="Description (optional)"
                        value={eventTypeDescription}
                        onchange={handleEventTypeDescriptionChange}
                        placeholder="Brief description shown on your booking page"
                        class="slds-m-bottom_small"
                    ></lightning-textarea>
                    <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                        <lightning-button label="Back" onclick={handleBackToAvailability}></lightning-button>
                        <lightning-button label="Finish Setup" variant="brand" onclick={handleCreateEventType}></lightning-button>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <template lwc:if={isDashboard}>
        <div class="dashboard-container">
            <lightning-card title="Cal.DIY - You're All Set!" icon-name="standard:event">
                <div class="slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                            <div class="slds-box slds-box_small slds-text-align_center">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">Timezone</p>
                                <p class="slds-text-heading_small">{dashboardData.timezone}</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                            <div class="slds-box slds-box_small slds-text-align_center">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">Event Types</p>
                                <p class="slds-text-heading_small">{dashboardData.eventTypeCount} active</p>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                            <div class="slds-box slds-box_small slds-text-align_center">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">Schedules</p>
                                <p class="slds-text-heading_small">{dashboardData.scheduleCount} configured</p>
                            </div>
                        </div>
                    </div>
                    <div class="slds-m-top_medium slds-text-align_center">
                        <p class="slds-text-body_regular slds-m-bottom_small">
                            Your booking page is ready. Share the Calendar Booking tab or add the component to Experience Cloud with a Host User ID.
                        </p>
                        <lightning-button label="Open Booking Page" variant="brand" onclick={handleOpenBookingPage} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Manage Schedule" variant="neutral" onclick={handleOpenScheduleManager} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="View Bookings" variant="neutral" onclick={handleOpenBookingManager} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Run Setup Again" variant="neutral" onclick={handleRestartWizard}></lightning-button>
                    </div>
                </div>
            </lightning-card>

            <template lwc:if={isSchedulingAdmin}>
                <lightning-card title="Org Calendar Integration (Admin)" icon-name="standard:connected_apps" class="slds-m-top_medium">
                    <div class="slds-p-around_medium">
                        <template lwc:if={showingDashboardAdminOAuthFlow}>
                            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">{authenticateCalendarHeading}</h3>
                                <template lwc:if={oauthNotConfigured}>
                                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                                        <p class="slds-text-body_regular">{oauthSetupMessage}</p>
                                    </div>
                                    <lightning-button label="Open Auth Provider Setup" variant="brand" onclick={handleOpenOAuthSetup} icon-name="utility:settings" class="slds-m-right_small"></lightning-button>
                                </template>
                                <template lwc:if={notShowingOrgAuthNotice}>
                                    <lightning-button label="Authenticate" variant="brand" onclick={handleAuthorizeOAuth} icon-name="utility:new_window" class="slds-m-right_x-small"></lightning-button>
                                    <lightning-button label="Verify Connection" variant="success" onclick={handleVerifyOAuth} icon-name="utility:check" class="slds-m-right_x-small"></lightning-button>
                                    <lightning-button label="Cancel" variant="neutral" onclick={handleCancelAdminAuth}></lightning-button>
                                </template>
                            </div>
                        </template>

                        <template lwc:if={showingDashboardAdminAuth}>
                            <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                                Google and Microsoft calendar APIs use org-level Named Principals. Authenticate each service once here or in Integrations.
                            </p>
                            <lightning-button label="Authenticate Google Calendar" variant="brand" onclick={handleAuthenticateGoogleAdmin} icon-name="utility:connected_apps" class="slds-m-right_x-small slds-m-bottom_x-small"></lightning-button>
                            <lightning-button label="Authenticate Microsoft Outlook" variant="brand" onclick={handleAuthenticateMicrosoftAdmin} icon-name="utility:connected_apps" class="slds-m-right_x-small slds-m-bottom_x-small"></lightning-button>
                            <lightning-button label="Open Integrations" variant="neutral" onclick={handleOpenIntegrations} class="slds-m-bottom_x-small"></lightning-button>
                        </template>
                    </div>
                </lightning-card>
            </template>
        </div>
    </template>
</template>
