<template>
    <lightning-card title="Workflow Builder" icon-name="standard:flow">
        <div slot="actions">
            <template lwc:if={isListView}>
                <lightning-button label="New Workflow" variant="brand" onclick={handleNewWorkflowClick}></lightning-button>
            </template>
            <template lwc:if={isDetailView}>
                <lightning-button label="Back to List" onclick={handleBackToList}></lightning-button>
            </template>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <h2>{error}</h2>
                </div>
            </div>
        </template>

        <template lwc:if={isListView}>
            <div class="slds-p-around_medium">
                <template lwc:if={hasWorkflows}>
                    <template for:each={displayWorkflows} for:item="workflow">
                        <div key={workflow.Id} class="slds-box slds-m-bottom_small">
                            <div class="slds-grid slds-grid_align-spread">
                                <div>
                                    <h3 class="slds-text-heading_small">
                                        {workflow.Name}
                                        <span class="slds-badge slds-m-left_x-small">{workflow.statusLabel}</span>
                                    </h3>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {workflow.Trigger_Event__c} · {workflow.eventTypeLabel}
                                    </p>
                                </div>
                                <lightning-button label="Edit" variant="neutral" data-id={workflow.Id} onclick={handleEditWorkflowClick}></lightning-button>
                            </div>
                        </div>
                    </template>
                </template>

                <template lwc:if={noWorkflows}>
                    <template lwc:if={notLoading}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <p class="slds-text-color_weak">No workflows configured. Create one to get started.</p>
                        </div>
                    </template>
                </template>
            </div>
        </template>

        <template lwc:if={isDetailView}>
            <div class="slds-p-around_medium">
                <div class="slds-box slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Workflow Details</h3>
                    <lightning-input type="text" label="Workflow Name" value={editWorkflowName} onchange={handleEditWorkflowNameChange} required></lightning-input>
                    <lightning-combobox label="Trigger Event" options={triggerEventOptions} value={editWorkflowTriggerEvent} onchange={handleEditWorkflowTriggerChange} class="slds-m-top_small"></lightning-combobox>
                    <lightning-combobox label="Event Type" options={eventTypeOptions} value={editWorkflowEventTypeId} onchange={handleEditWorkflowEventTypeChange} class="slds-m-top_small"></lightning-combobox>
                    <template lwc:if={showTimeOffset}>
                        <lightning-input type="number" label="Time Offset (minutes)" value={editWorkflowTimeOffset} onchange={handleEditWorkflowTimeOffsetChange} class="slds-m-top_small"></lightning-input>
                    </template>
                    <lightning-input type="checkbox" label="Active" checked={editWorkflowIsActive} onchange={handleEditWorkflowIsActiveChange} class="slds-m-top_small"></lightning-input>
                    <div class="slds-m-top_small">
                        <lightning-button label="Save Details" variant="brand" onclick={handleSaveWorkflowDetails}></lightning-button>
                    </div>
                </div>

                <div class="slds-box">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">Steps</h3>
                        <lightning-button label="Add Step" variant="neutral" onclick={handleAddStepClick}></lightning-button>
                    </div>
                    <template lwc:if={hasSteps}>
                        <table class="slds-table slds-table_cell-buffer">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Action</th>
                                    <th>Recipient</th>
                                    <th>Template / URL</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={workflowDetail.steps} for:item="step">
                                    <tr key={step.id}>
                                        <td>{step.sortOrder}</td>
                                        <td>{step.actionType}</td>
                                        <td>{step.recipient}</td>
                                        <td>
                                            <template lwc:if={step.template}>{step.template}</template>
                                            <template lwc:if={step.webhookUrl}>{step.webhookUrl}</template>
                                        </td>
                                        <td>
                                            <lightning-button label="Edit" variant="base" data-id={step.id} onclick={handleEditStepClick}></lightning-button>
                                            <lightning-button label="Delete" variant="base" data-id={step.id} onclick={handleDeleteStep}></lightning-button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak">No steps yet.</p>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>

    <template lwc:if={showNewWorkflowModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={handleCancelNewWorkflow} alternative-text="Close" class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">New Workflow</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input type="text" label="Workflow Name" onchange={handleNewWorkflowNameChange} required></lightning-input>
                    <lightning-combobox label="Trigger Event" options={triggerEventOptions} value={newWorkflowTriggerEvent} onchange={handleNewWorkflowTriggerChange} class="slds-m-top_small"></lightning-combobox>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCancelNewWorkflow}></lightning-button>
                    <lightning-button label="Create" variant="brand" onclick={handleCreateWorkflow}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template lwc:if={showStepModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" onclick={handleCancelStep} alternative-text="Close" class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-text-heading_medium">{stepModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox label="Action Type" options={actionTypeOptions} value={stepActionType} onchange={handleStepActionTypeChange}></lightning-combobox>
                    <lightning-input type="number" label="Sort Order" value={stepSortOrder} onchange={handleStepSortOrderChange} class="slds-m-top_small"></lightning-input>
                    <template lwc:if={isEmailOrSmsStep}>
                        <lightning-combobox label="Recipient" options={recipientOptions} value={stepRecipient} onchange={handleStepRecipientChange} class="slds-m-top_small"></lightning-combobox>
                        <lightning-textarea label="Template" value={stepTemplate} onchange={handleStepTemplateChange} class="slds-m-top_small"></lightning-textarea>
                    </template>
                    <template lwc:if={isWebhookStep}>
                        <lightning-input type="url" label="Webhook URL" value={stepWebhookUrl} onchange={handleStepWebhookUrlChange} class="slds-m-top_small"></lightning-input>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCancelStep}></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={handleSaveStep}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
